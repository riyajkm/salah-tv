name: Release

# vX.Y.Z       -> production release (tag on main)
# vX.Y.Z-rc.N  -> pre-release (tag on stage)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          BASE="${TAG%%-*}"
          [ "$BASE" = "$PUB" ] || { echo "Tag $TAG does not match pubspec $PUB"; exit 1; }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Name artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "SalahLK-${GITHUB_REF_NAME}.apk"
      - name: Extract changelog notes
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
          awk -v v="$V" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: SalahLK-${{ github.ref_name }}.apk
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
