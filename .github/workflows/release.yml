name: Release

# vX.Y.Z       -> production release (tag on main)
# vX.Y.Z-rc.N  -> pre-release (tag on stage)
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          BASE="${TAG%%-*}"
          [ "$BASE" = "$PUB" ] || { echo "Tag $TAG does not match pubspec $PUB"; exit 1; }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
            echo "ANDROID_KEYSTORE_FILE=upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret; building with the debug key"
          fi
      - name: Build APK and Play bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Name artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "SalahLK-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "SalahLK-${GITHUB_REF_NAME}.aab"
      - name: Extract changelog notes
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
          awk -v v="$V" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SalahLK-${{ github.ref_name }}.apk
            SalahLK-${{ github.ref_name }}.aab
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
