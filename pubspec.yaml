name: salah_lk
description: "SalahLK - Mosque Prayer Times for Sri Lanka. Prayer clock display for Android TV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  adhan: ^2.0.0+1
  hijri: ^3.0.1
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.1
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#0A0A0F"
  image: assets/icon/splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#0A0A0F"
    image: assets/icon/splash.png
    icon_background_color: "#0A0A0F"

flutter:
  uses-material-design: true

  assets:
    - assets/audio/chime.wav
    - assets/prayer_times.json

  fonts:
    # 7-segment digital font (OFL). https://github.com/keshikan/DSEG
    - family: DSEG7
      fonts:
        - asset: assets/fonts/DSEG7Classic-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
